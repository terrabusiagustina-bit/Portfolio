<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agustina Terrabusi — Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0d0d0d; /* Fondo oscuro para que resalten los colores */
    --text: #ffffff;
    --accent-green: #b7ff00;
    --accent-orange: #ff6b2c;
    --accent-blue: #445dff;
    --card-bg: rgba(255, 255, 255, 0.05);
}

* { margin: 0; padding: 0; box-sizing: border-box; cursor: none; } /* Ocultamos cursor default */

body {
    font-family: 'Space Grotesk', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    line-height: 1.6;
}

/* Grano de película artístico de fondo */
body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://grainy-gradients.vercel.app/noise.svg');
    opacity: 0.05;
    pointer-events: none;
    z-index: 1000;
}

/* Custom Cursor */
.cursor-dot {
    width: 8px; height: 8px; background: white;
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 10000; transition: transform 0.1s;
}
.cursor-outline {
    width: 40px; height: 40px; border: 2px solid var(--accent-green);
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 9999; transition: all 0.2s ease-out;
}

nav {
    position: fixed; width: 100%; top: 0; padding: 30px 60px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 100; mix-blend-mode: difference;
}

nav h1 { font-family: 'Anton', sans-serif; font-size: 1.2rem; letter-spacing: 2px; }
nav ul { display: flex; gap: 40px; list-style: none; }
nav a { text-decoration: none; color: white; font-weight: 500; font-size: 0.9rem; text-transform: uppercase; }

.hero {
    height: 100vh; display: flex; flex-direction: column; justify-content: center;
    padding: 0 10%; position: relative;
}

.hero h2 {
    font-family: 'Anton', sans-serif;
    font-size: clamp(4rem, 15vw, 12rem);
    line-height: 0.85;
    text-transform: uppercase;
    z-index: 2;
}

.hero-sub {
    color: var(--accent-green);
    font-weight: 700; letter-spacing: 5px; margin-bottom: 20px;
}

/* Blobs de color animados en el fondo */
.blob {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; z-index: 1; animation: orbit 20s infinite linear;
}
.blob-1 { width: 400px; height: 400px; background: var(--accent-blue); top: 10%; right: 10%; }
.blob-2 { width: 300px; height: 300px; background: var(--accent-orange); bottom: 10%; left: 10%; animation-delay: -5s; }

@keyframes orbit {
    0% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(50px, -50px) scale(1.1); }
    66% { transform: translate(-30px, 40px) scale(0.9); }
    100% { transform: translate(0, 0) scale(1); }
}

/* Proyectos con Glassmorphism */
#projects { padding: 100px 10%; }
.section-title { font-family: 'Anton', sans-serif; font-size: 4rem; margin-bottom: 50px; color: var(--accent-green); }

.projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 30px;
}

.project-card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    overflow: hidden;
    height: 450px;
    transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
}

.project-card:hover {
    transform: translateY(-15px) scale(1.02);
    border-color: var(--accent-green);
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}

.project-card img {
    width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: 0.5s;
}

.project-card:hover img { opacity: 1; transform: scale(1.1); }

.project-info {
    position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px;
    background: linear-gradient(transparent, rgba(0,0,0,0.9));
}

/* Contacto tipo "Call to Action" */
.contact { text-align: center; padding: 150px 10%; }
.btn-contact {
    display: inline-block; padding: 20px 50px; border: 2px solid white;
    border-radius: 50px; font-family: 'Anton', sans-serif; font-size: 2rem;
    color: white; text-decoration: none; transition: 0.3s;
}
.btn-contact:hover { background: white; color: black; transform: scale(1.1); }

/* Animación de entrada */
.reveal { opacity: 0; transform: translateY(50px); transition: all 1s ease-out; }
.reveal.active { opacity: 1; transform: translateY(0); }

@media (max-width: 768px) {
    nav { padding: 20px; }
    .hero h2 { font-size: 5rem; }
}
</style>
</head>
<body>

<div class="cursor-dot"></div>
<div class="cursor-outline"></div>

<nav>
    <h1>A. TERRABUSI</h1>
    <ul>
        <li><a href="#projects" class="hover-target">Proyectos</a></li>
        <li><a href="#about" class="hover-target">Bio</a></li>
        <li><a href="#contact" class="hover-target">Contacto</a></li>
    </ul>
</nav>

<section class="hero">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <p class="hero-sub">DISEÑO • ARTE • 3D</p>
    <h2>AGUSTINA<br>TERRABUSI</h2>
</section>

<section id="projects">
    <h2 class="section-title reveal">PROYECTOS</h2>
    <div class="projects-grid">
        <div class="project-card reveal hover-target">
            <img src="https://images.unsplash.com/photo-1545239351-1141bd82e8a6?q=80&w=1200" alt="3D">
            <div class="project-info">
                <h3>Modelado 3D</h3>
                <p>Blender & Octane</p>
            </div>
        </div>
        <div class="project-card reveal hover-target">
            <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200" alt="Games">
            <div class="project-info">
                <h3>Videojuegos</h3>
                <p>Unity Engine</p>
            </div>
        </div>
        </div>
</section>

<section id="contact" class="contact">
    <h2 class="reveal">¿TIENES UNA IDEA?</h2>
    <a href="mailto:agustinaterrabusi15@gmail.com" class="btn-contact reveal hover-target">HABLEMOS</a>
</section>

<script>
    // Custom Cursor Logic
    const dot = document.querySelector('.cursor-dot');
    const outline = document.querySelector('.cursor-outline');
    const hoverTargets = document.querySelectorAll('.hover-target');

    window.addEventListener('mousemove', (e) => {
        const posX = e.clientX;
        const posY = e.clientY;

        dot.style.left = `${posX}px`;
        dot.style.top = `${posY}px`;

        outline.animate({
            left: `${posX}px`,
            top: `${posY}px`
        }, { duration: 500, fill: "forwards" });
    });

    hoverTargets.forEach(target => {
        target.addEventListener('mouseenter', () => {
            outline.style.transform = 'scale(2)';
            outline.style.background = 'rgba(183, 255, 0, 0.2)';
        });
        target.addEventListener('mouseleave', () => {
            outline.style.transform = 'scale(1)';
            outline.style.background = 'transparent';
        });
    });

    // Scroll Reveal
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) entry.target.classList.add('active');
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
